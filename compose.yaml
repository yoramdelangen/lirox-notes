# Example deployment. Passkeys need HTTPS unless you open http://localhost.
# The first onboarding step asks which domain(s) you use and stores them in
# the config volume; LIROX_RP_ID / LIROX_RP_ORIGIN override that if set.
services:
  liroxnotes:
    image: ghcr.io/yoramdelangen/lirox-notes:latest
    ports:
      - "8080:8080"
    # Optional overrides (see README):
    # environment:
    #   LIROX_RP_ORIGIN: https://notes.example.com
    #   # SSH remotes: a deploy key and pinned host keys.
    #   LIROX_GIT_SSH_KEY: /run/secrets/git_key
    #   LIROX_GIT_KNOWN_HOSTS: /run/secrets/known_hosts
    #   # HTTPS remotes: a fine-grained token, only sent to these hosts.
    #   LIROX_GIT_TOKEN: ${LIROX_GIT_TOKEN}
    #   LIROX_GIT_TOKEN_HOSTS: github.com
    volumes:
      - config:/config
      - data:/data
    # secrets:
    #   - git_key
    #   - known_hosts
    restart: unless-stopped

volumes:
  config:
  data:

# secrets:
#   git_key:
#     file: ./secrets/git_key
#   known_hosts:
#     file: ./secrets/known_hosts
