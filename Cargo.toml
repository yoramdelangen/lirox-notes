[workspace]
members = ["crates/app", "crates/backend", "crates/shared"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
dioxus = { version = "0.7.9", features = ["macro"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
uuid = { version = "1.0", features = ["v4"] }
