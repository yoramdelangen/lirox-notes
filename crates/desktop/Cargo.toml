[package]
name = "liroxnotes-desktop"
version.workspace = true
publish = false
edition.workspace = true

# The desktop app runs the regular LiroxNotes server in-process on
# 127.0.0.1 and shows the web client in a native window, so web and desktop
# share every line of UI and backend code.

# macOS only for now; elsewhere the binary is a stub, so CI on Linux needs no
# WebKitGTK.
[target.'cfg(target_os = "macos")'.dependencies]
axum = "0.8"
dioxus = { workspace = true, features = ["server", "fullstack"] }
liroxnotes-app = { path = "../app", default-features = false, features = ["server"] }
liroxnotes-backend = { path = "../backend" }
muda = "0.21"
serde = { version = "1", features = ["derive"] }
tao = "0.34"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
uuid.workspace = true
wry = "0.53"

[features]
# Statically link libgit2, libssh2 and OpenSSL for distributable builds.
static = ["liroxnotes-app/static"]
