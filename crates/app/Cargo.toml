[package]
name = "liroxnotes-app"
version = "0.1.0"
authors = ["Yoram <yoramdelangen@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus.workspace = true
liroxnotes-backend = { path = "../backend", optional = true }
liroxnotes-shared = { path = "../shared" }
serde = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["CustomEvent", "Element", "Event", "EventTarget", "HtmlElement", "KeyboardEvent", "MediaQueryList", "Window", "Storage"] }

[features]
default = ["web"]
web = ["dioxus/web", "dioxus/fullstack"]
desktop = ["dioxus/desktop", "dioxus/fullstack"]
server = ["dioxus/server", "dioxus/fullstack", "web", "dep:liroxnotes-backend"]
