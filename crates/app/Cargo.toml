[package]
name = "liroxnotes-app"
version = "0.1.0"
authors = ["Yoram <yoramdelangen@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus.workspace = true
liroxnotes-shared = { path = "../shared" }
serde = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Element", "EventTarget", "HtmlElement"] }

[features]
default = ["web"]
web = ["dioxus/web"]
