[package]
name = "liroxnotes-app"
edition.workspace = true
version.workspace = true

[[bin]]
name = "liroxnotes-app"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
dioxus = { workspace = true, features = ["web"] }
liroxnotes-shared = { path = "../shared" }
js-sys = "0.3.82"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.103"
wasm-bindgen-futures = "0.4.53"
web-sys = { version = "0.3.82", features = ["Window", "Location", "History", "Headers", "PopStateEvent", "CustomEvent", "CustomEventInit", "Event", "EventTarget", "Response", "RequestCredentials", "RequestInit"] }
