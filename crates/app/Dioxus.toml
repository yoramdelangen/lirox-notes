[application]
public_dir = "public"

[web.app]

# HTML title tag content
title = "LiroxNotes"

[web.watcher]
watch_path = ["src", "assets"]
reload_html = true

# include `assets` in web platform
[web.resource]

# Stylesheets are linked from `App` via `asset!()` so they are hashed and
# bundled; listing them here too would load them twice.
style = []

[web.resource.dev]
script = []
