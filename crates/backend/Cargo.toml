[package]
name = "liroxnotes-backend"
edition.workspace = true
version.workspace = true
publish = false

[dependencies]
base64 = "0.23"
hmac = "0.12"
liroxnotes-shared = { path = "../shared" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
toml_edit = { version = "0.25", features = ["serde"] }
uuid.workspace = true
webauthn-rs.workspace = true
git2.workspace = true
openssl = { version = "0.10", optional = true }

[features]
# Statically link libgit2, libssh2 and OpenSSL (release/container builds).
static = ["git2/vendored-libgit2", "git2/vendored-openssl", "dep:openssl", "openssl/vendored"]
