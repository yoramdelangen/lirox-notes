# cargo-deny: run `cargo deny check` (CI runs it on every PR).

[graph]
all-features = true

[advisories]
# Known vulnerabilities are always errors; unmaintained crates are errors for
# crates we depend on directly.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only. Ask before adding any copyleft license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "NCSA",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
